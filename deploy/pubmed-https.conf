limit_req_zone $server_name zone=pubmed_analysis:1m rate=2r/m;
server {
    listen 80;
    server_name pubmed.ai-calendar.xyz;
    location /.well-known/acme-challenge/ { root /var/lib/pubmed-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name pubmed.ai-calendar.xyz;
    ssl_certificate /etc/letsencrypt/live/pubmed.ai-calendar.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pubmed.ai-calendar.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/pubmed/frontend/dist;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
    location = /api/analyses {
        limit_req zone=pubmed_analysis burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_read_timeout 30s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
